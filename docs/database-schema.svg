<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1480" viewBox="0 0 1180 1480">
  <style>
    .box { fill:#ffffff; stroke:#334155; stroke-width:1.5; rx:6; }
    .read { fill:#f0fdf4; stroke:#15803d; stroke-width:1.8; rx:6; }
    .title { font:700 15px Arial, sans-serif; fill:#0f172a; }
    .text { font:12px Arial, sans-serif; fill:#334155; }
    .line { stroke:#2563eb; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    .readline { stroke:#16a34a; stroke-width:1.8; fill:none; marker-end:url(#greenArrow); stroke-dasharray:5 4; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect class="box" x="40" y="50" width="260" height="150"/>
  <text class="title" x="60" y="80">outsource_processing_cost_group</text>
  <text class="text" x="60" y="108">PK outsource_processing_cost_group_id</text>
  <text class="text" x="60" y="130">cost_group_no, settlement_month</text>
  <text class="text" x="60" y="152">process_type, status</text>
  <text class="text" x="60" y="174">standard_amount, actual_amount</text>

  <rect class="box" x="380" y="40" width="260" height="120"/>
  <text class="title" x="400" y="70">outsource_processing_cost_work_group</text>
  <text class="text" x="400" y="98">FK cost_group_id</text>
  <text class="text" x="400" y="120">FK outsource_work_group_id</text>

  <rect class="box" x="720" y="40" width="220" height="142"/>
  <text class="title" x="740" y="70">outsource_work_group</text>
  <text class="text" x="740" y="98">PK outsource_work_group_id</text>
  <text class="text" x="740" y="120">process_type, status</text>
  <text class="text" x="740" y="142">FK representative_lot_id</text>
  <text class="text" x="740" y="164">canceled_at, canceled_reason</text>

  <rect class="box" x="960" y="40" width="190" height="142"/>
  <text class="title" x="980" y="70">owg_change_log</text>
  <text class="text" x="980" y="98">PK change_log_id</text>
  <text class="text" x="980" y="120">FK work_group_id</text>
  <text class="text" x="980" y="142">action_type, reason</text>
  <text class="text" x="980" y="164">before/after JSONB</text>

  <rect class="box" x="380" y="250" width="280" height="135"/>
  <text class="title" x="400" y="280">outsource_processing_cost_allocation</text>
  <text class="text" x="400" y="308">FK cost_group_id</text>
  <text class="text" x="400" y="330">FK lot_id</text>
  <text class="text" x="400" y="352">basis_type, basis_value, ratio</text>
  <text class="text" x="400" y="374">standard_allocated, actual_allocated</text>

  <rect class="box" x="740" y="260" width="210" height="150"/>
  <text class="title" x="760" y="290">lot</text>
  <text class="text" x="760" y="318">PK lot_id</text>
  <text class="text" x="760" y="340">order_line_id, product_id</text>
  <text class="text" x="760" y="362">parent_lot_id, memo</text>
  <text class="text" x="760" y="384">status, lot_qty</text>
  <text class="text" x="760" y="406">CHECK rework memo required</text>

  <rect class="box" x="980" y="250" width="170" height="105"/>
  <text class="title" x="1000" y="280">order_line</text>
  <text class="text" x="1000" y="308">PK order_line_id</text>
  <text class="text" x="1000" y="330">partner_id, product_id</text>

  <rect class="read" x="40" y="250" width="300" height="150"/>
  <text class="title" x="60" y="280">production_progress_snapshot</text>
  <text class="text" x="60" y="308">UNIQUE order_line_id</text>
  <text class="text" x="60" y="330">status, work_type</text>
  <text class="text" x="60" y="352">current_process, progress_rate</text>
  <text class="text" x="60" y="374">due_date, display snapshots</text>

  <rect class="box" x="40" y="560" width="310" height="100"/>
  <text class="title" x="60" y="590">inspection_result</text>
  <text class="text" x="60" y="618">inspected_qty = good + defect_ship + defect</text>
  <text class="text" x="60" y="640">uninspected_qty, discard_qty</text>
  <text class="text" x="60" y="662">received_qty = inspected + uninspected</text>

  <rect class="box" x="430" y="540" width="230" height="105"/>
  <text class="title" x="450" y="570">inspection_schedule</text>
  <text class="text" x="450" y="598">PK inspection_schedule_id</text>
  <text class="text" x="450" y="620">FK lot_id</text>

  <rect class="box" x="740" y="500" width="220" height="105"/>
  <text class="title" x="760" y="530">shipment_line</text>
  <text class="text" x="760" y="558">order_line_id, product_id</text>
  <text class="text" x="760" y="580">source_type, status, ship_qty</text>

  <rect class="box" x="980" y="500" width="170" height="105"/>
  <text class="title" x="1000" y="530">product_inventory</text>
  <text class="text" x="1000" y="558">product_id UNIQUE</text>
  <text class="text" x="1000" y="580">current_qty</text>

  <rect class="box" x="40" y="730" width="220" height="105"/>
  <text class="title" x="60" y="760">raw_material</text>
  <text class="text" x="60" y="788">PK raw_material_id</text>
  <text class="text" x="60" y="810">material_code UNIQUE</text>
  <text class="text" x="60" y="832">standard_unit_cost</text>

  <rect class="box" x="330" y="730" width="240" height="105"/>
  <text class="title" x="350" y="760">raw_material_location</text>
  <text class="text" x="350" y="788">PK raw_material_location_id</text>
  <text class="text" x="350" y="810">location_code UNIQUE</text>
  <text class="text" x="350" y="832">location_type, partner_id</text>

  <rect class="box" x="650" y="710" width="240" height="125"/>
  <text class="title" x="670" y="740">raw_material_inventory_lot</text>
  <text class="text" x="670" y="768">FK raw_material_id</text>
  <text class="text" x="670" y="790">FK location_id</text>
  <text class="text" x="670" y="812">lot_no, current_qty</text>
  <text class="text" x="670" y="834">unit_cost, received_at</text>

  <rect class="box" x="930" y="700" width="220" height="145"/>
  <text class="title" x="950" y="730">raw_material_movement</text>
  <text class="text" x="950" y="758">FK material/location/lot</text>
  <text class="text" x="950" y="780">movement_type, qty</text>
  <text class="text" x="950" y="802">balance_after</text>
  <text class="text" x="950" y="824">cost snapshots, transfer_key</text>

  <rect class="box" x="650" y="860" width="300" height="82"/>
  <text class="title" x="670" y="890">owg_raw_material_allocation</text>
  <text class="text" x="670" y="916">FK work_group/material/location/lot</text>
  <text class="text" x="670" y="936">qty, cost snapshots, movement_id</text>

  <rect class="box" x="40" y="990" width="250" height="170"/>
  <text class="title" x="60" y="1020">self_use_sheet_job</text>
  <text class="text" x="60" y="1048">PK self_use_sheet_job_id</text>
  <text class="text" x="60" y="1070">use_no UNIQUE, purpose_type</text>
  <text class="text" x="60" y="1092">execution_type, partner_id</text>
  <text class="text" x="60" y="1114">status, cutting dimensions</text>
  <text class="text" x="60" y="1136">fees, output, version, audit</text>

  <rect class="box" x="330" y="990" width="270" height="170"/>
  <text class="title" x="350" y="1020">self_use_sheet_rm_allocation</text>
  <text class="text" x="350" y="1048">FK job/material/source location</text>
  <text class="text" x="350" y="1070">FK original/processing RM LOT</text>
  <text class="text" x="350" y="1092">planned, consumed, returned qty</text>
  <text class="text" x="350" y="1114">cost snapshots, transfer keys</text>
  <text class="text" x="350" y="1136">status</text>

  <rect class="box" x="650" y="990" width="240" height="170"/>
  <text class="title" x="670" y="1020">self_use_sheet_inventory_lot</text>
  <text class="text" x="670" y="1048">FK job UNIQUE, raw_material</text>
  <text class="text" x="670" y="1070">sheet_lot_no UNIQUE</text>
  <text class="text" x="670" y="1092">initial/current sheet qty</text>
  <text class="text" x="670" y="1114">material/processing/total cost</text>
  <text class="text" x="670" y="1136">status, version</text>

  <rect class="box" x="930" y="990" width="220" height="170"/>
  <text class="title" x="950" y="1020">self_use_sheet_movement</text>
  <text class="text" x="950" y="1048">FK sheet inventory LOT</text>
  <text class="text" x="950" y="1070">movement_type, signed qty</text>
  <text class="text" x="950" y="1092">balance_after, purpose</text>
  <text class="text" x="950" y="1114">cost snapshots, actor</text>
  <text class="text" x="950" y="1136">source movement UNIQUE</text>

  <rect class="box" x="40" y="1210" width="300" height="135"/>
  <text class="title" x="60" y="1240">owg_self_use_sheet_allocation</text>
  <text class="text" x="60" y="1268">FK work_group/sheet LOT/location</text>
  <text class="text" x="60" y="1290">sheet qty, cost snapshots</text>
  <text class="text" x="60" y="1312">movement_id, status</text>

  <rect class="box" x="380" y="1210" width="330" height="160"/>
  <text class="title" x="400" y="1240">owg_self_use_sheet_source_snapshot</text>
  <text class="text" x="400" y="1268">FK sheet allocation/source RM allocation</text>
  <text class="text" x="400" y="1290">original raw-material LOT reference</text>
  <text class="text" x="400" y="1312">material/LOT/location snapshots</text>
  <text class="text" x="400" y="1334">consumed qty and cost snapshots</text>

  <rect class="box" x="750" y="1210" width="300" height="135"/>
  <text class="title" x="770" y="1240">self_use_sheet_inventory_balance</text>
  <text class="text" x="770" y="1268">FK sheet inventory LOT/location</text>
  <text class="text" x="770" y="1290">UNIQUE sheet LOT + location</text>
  <text class="text" x="770" y="1312">current_qty</text>

